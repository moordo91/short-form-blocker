<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <title>숏폼 차단기</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <h2>숏폼 차단기</h2>
    <label class="setting">
      <span>사이드바 Shorts 숨기기</span>
      <input type="checkbox" id="sidebar" checked />
      <span class="slider"></span>
    </label>

    <label class="setting">
      <span>홈 화면 Shorts 숨기기</span>
      <input type="checkbox" id="home" checked />
      <span class="slider"></span>
    </label>

    <label class="setting">
      <span>검색 결과 Shorts 숨기기</span>
      <input type="checkbox" id="search" checked />
      <span class="slider"></span>
    </label>

    <label class="setting">
      <span>구독 화면 Shorts 숨기기</span>
      <input type="checkbox" id="subscription">
      <span class="slider"></span>
    </label>

    <label class="setting">
      <span>Shorts 필터 숨기기</span>
      <input type="checkbox" id="filter" checked />
      <span class="slider"></span>
    </label>

    <script src="popup.js"></script>
  </body>
</html>
